<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}秋山旅館 経理{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
    <div class="brand">秋山旅館 経理</div>
    <nav>
        <a href="{{ url_for('dashboard') }}">ダッシュボード</a>
        <a href="{{ url_for('transactions') }}">収支入力</a>
        <a href="{{ url_for('settlements_view') }}">精算</a>
        <a href="{{ url_for('reports') }}">レポート</a>
        <a href="{{ url_for('closings_view') }}">月次締め</a>
        <a href="{{ url_for('settings_view') }}">設定</a>
    </nav>
</header>

<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>
</body>
</html>
