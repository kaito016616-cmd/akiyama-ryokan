<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初回セットアップ - 秋山旅館 経理</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main class="container login-container">
    <h1>初回セットアップ</h1>
    <p class="muted">最初の管理者アカウントを作成してください。あとから「設定」画面で他のメンバーを追加できます。</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="post" class="form-grid">
        <div class="field">
            <label>名前</label>
            <input type="text" name="name" required autofocus>
        </div>
        <div class="field">
            <label>PINコード（数字4桁程度）</label>
            <input type="password" name="pin_code" inputmode="numeric" maxlength="8" required>
        </div>
        <div class="field">
            <button type="submit" class="button">管理者アカウントを作成</button>
        </div>
    </form>
</main>
</body>
</html>
